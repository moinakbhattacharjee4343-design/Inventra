    <script>
      (function () {
        try {
          var saved = localStorage.getItem("inventra_theme_v1");
          var useDark;
          if (saved === "dark") {
            useDark = true;
          } else if (saved === "light") {
            useDark = false;
          } else {
            var prefersLight =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches;
            var prefersDark =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches;
            useDark = prefersDark ? true : prefersLight ? false : true;
          }
          document.documentElement.classList.toggle("dark", useDark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
